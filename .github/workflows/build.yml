name: Build and evaluate Hoover
on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    name: Native macOS validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, package and verify signature
        run: bash scripts/ci-build.sh bash scripts/build-app.sh
        env:
          HOOVER_SNAPSHOT_DIR: ${{ github.workspace }}/dist/evaluation-snapshots
          HOOVER_NATIVE_ACTION_TESTS: '1'
          HOOVER_LAUNCH_SMOKE_TEST: '1'
      - name: Upload compiled universal macOS app
        uses: actions/upload-artifact@v4
        with:
          name: Hoover-${{ matrix.os }}
          path: dist/Hoover-macOS.zip
          if-no-files-found: error
      - name: Upload native UI evaluation snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hoover-UI-${{ matrix.os }}
          path: dist/evaluation-snapshots/*.png
          if-no-files-found: warn
  core:
    name: Portable core validation
    runs-on: ubuntu-24.04
    container: swift:6.1.3
    steps:
      - uses: actions/checkout@v4
      - name: Test core and parse native sources
        run: bash scripts/ci-build.sh bash scripts/check-source.sh
